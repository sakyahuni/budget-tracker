<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodo Budget</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e6ec;
    --accent:#2f5bea; --accent-weak:#e8eefe; --danger:#d23b3b; --ok:#1f9d63;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#12151c; --card:#1b1f29; --text:#e8ebf2; --muted:#98a0b3; --line:#2b3140;
      --accent:#7b9bff; --accent-weak:#232c4a; --danger:#ff7676; --ok:#4cd08d;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 16px}
  h2{font-size:16px;margin:0 0 12px}
  .grid{display:grid;gap:12px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat .label{color:var(--muted);font-size:13px}
  .stat .value{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  input,select,textarea,button{font:inherit;color:var(--text)}
  input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger)}
  button.small{padding:4px 8px;font-size:13px}
  .form{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
  .form .wide{grid-column:1/-1}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:12px;color:var(--muted);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.off td{opacity:.45}
  .tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--accent-weak);color:var(--accent)}
  .tag.y{background:#fff3df;color:#b86b00}
  @media (prefers-color-scheme:dark){.tag.y{background:#3b2f17;color:#ffbd5c}}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted)}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .months{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .month{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
  .month.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .month .mh{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
  .month ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
  .month li{display:flex;justify-content:space-between;gap:8px}
  .bar{height:8px;border-radius:4px;background:var(--accent);margin-top:8px;min-width:2px}
  .empty{color:var(--muted);text-align:center;padding:28px 0}
  .hidden{display:none}
  .cat-bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .cat-bar .name{width:90px;flex:none}
  .cat-bar .track{flex:1;background:var(--bg);border-radius:4px;height:10px;overflow:hidden}
  .cat-bar .fill{height:100%;background:var(--accent)}
  .cat-bar .amt{width:110px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
  .scroll{overflow-x:auto}
  .storage{margin-bottom:16px;padding:12px 16px}
  .storage .note{color:var(--muted);font-size:12px;margin-top:4px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.warn{background:#e0a100} .dot.err{background:var(--danger)}
  details.wide{border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
  details.wide summary{cursor:pointer;color:var(--muted);font-size:13px}
  .mamt{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .hint{color:var(--muted);font-size:12px}
  /* 월별 막대 그래프. 막대 색은 팔레트 검증을 통과한 파랑(라이트 #2a78d6 / 다크 #3987e5) */
  /* 항목별 색(범주형 슬롯 1~6, 팔레트 검증 통과)과 '기타'용 회색 */
  :root{--vc-s1:#2a78d6;--vc-s2:#eb6834;--vc-s3:#1baf7a;--vc-s4:#eda100;--vc-s5:#e87ba4;--vc-s6:#008300;--vc-other:#898781}
  @media (prefers-color-scheme:dark){:root{--vc-s1:#3987e5;--vc-s2:#d95926;--vc-s3:#199e70;--vc-s4:#c98500;--vc-s5:#d55181;--vc-s6:#008300}}
  .vc-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:12px;color:var(--text)}
  .vc-legend span{display:inline-flex;align-items:center;gap:6px}
  .vc-sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
  .vc-box{margin-bottom:16px}
  .vc-box h3{font-size:14px;margin:0 0 4px}
  .vc-plot{position:relative;height:250px;padding:12px 0 26px 44px}
  .vc-area{position:relative;height:100%;border-bottom:1px solid var(--muted)}
  .vc-gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
  .vc-gl span{position:absolute;left:-44px;width:38px;text-align:right;transform:translateY(-50%);font-size:11px;color:var(--muted)}
  .vc-cols{position:absolute;inset:0;display:flex}
  .vc-col{flex:1;height:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;outline:none;border-radius:4px}
  .vc-bar{width:min(24px,calc(100% - 4px));display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
  .vc-seg{width:100%;flex:none}
  .vc-seg + .vc-seg{box-shadow:0 -2px 0 0 var(--card)}      /* 쌓인 조각 사이 2px 간격은 배경색으로 */
  .vc-col:hover .vc-bar,.vc-col:focus-visible .vc-bar{filter:brightness(1.15)}
  .vc-col:focus-visible{box-shadow:inset 0 0 0 2px var(--text)}
  .vc-x{position:absolute;top:100%;margin-top:6px;font-size:11px;color:var(--muted)}
  .vc-val{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:600;color:var(--text)}
  .vc-tip .r span:first-child{word-break:keep-all}
  .vc-tip .r span:last-child{white-space:nowrap}
  .vc-tip{position:absolute;z-index:3;display:none;pointer-events:none;width:max-content;min-width:150px;max-width:calc(100% - 8px);padding:8px 10px;font-size:12px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .vc-tip .h{color:var(--muted)} .vc-tip .v{font-size:15px;font-weight:700;margin:2px 0 4px}
  .vc-tip .r{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
  .vc-tip .r .k{display:inline-flex;align-items:center;gap:6px}
  .vc-tip .r .k i{display:inline-block;width:10px;height:3px;border-radius:2px;flex:none}
  .vc-empty{color:var(--muted);text-align:center;padding:40px 0}
  details.vc-tbl{margin-top:8px;font-size:13px}
  details.vc-tbl summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dodo Budget</h1>

  <div class="card storage" id="storage">
    <div class="row between">
      <div><strong>저장 위치</strong> · <span id="storageStatus"></span></div>
      <div class="row" id="storageBtns"></div>
    </div>
    <div class="note" id="storageNote"></div>
  </div>

  <div class="grid cards" id="stats"></div>

  <div class="card" style="margin-bottom:16px">
    <h2 id="formTitle">고정지출 추가</h2>
    <form id="form" class="grid form">
      <label>항목명
        <input name="name" required placeholder="예: 넷플릭스, 자동차보험">
      </label>
      <label>분류
        <input name="category" list="cats" placeholder="예: 구독, 보험">
        <datalist id="cats"></datalist>
      </label>
      <label>기본 금액(원)
        <input name="amount" type="number" min="0" step="1" required inputmode="numeric">
      </label>
      <label>결제 주기
        <select name="cycle">
          <option value="monthly">매월</option>
          <option value="yearly">매년</option>
        </select>
      </label>
      <label id="monthField" class="hidden">결제 월
        <select name="month"></select>
      </label>
      <label>결제일
        <select name="day"></select>
      </label>
      <label class="wide">메모
        <input name="memo" placeholder="결제 수단, 해지 조건 등 (선택)">
      </label>
      <details id="varBox" class="wide">
        <summary>월별 금액이 달라지는 항목 (가스·수도요금 등)</summary>
        <div class="row" style="margin:8px 0">
          <label style="flex-direction:row;align-items:center;gap:8px">연도
            <select id="varYear"></select>
          </label>
          <span class="hint">비워 두면 기본 금액이 적용됩니다.</span>
        </div>
        <div class="mamt" id="varInputs"></div>
      </details>
      <div class="row wide">
        <button type="submit" class="primary" id="submitBtn">추가</button>
        <button type="button" id="cancelBtn" class="hidden">취소</button>
      </div>
    </form>
  </div>

  <div class="tabs" role="tablist">
    <button class="active" data-tab="list">목록</button>
    <button data-tab="calendar">연간 달력</button>
    <button data-tab="category">분류별</button>
  </div>

  <section id="tab-list" class="card">
    <div class="row between" style="margin-bottom:8px">
      <div class="row">
        <select id="filterCycle" aria-label="주기 필터">
          <option value="all">전체</option>
          <option value="monthly">매월</option>
          <option value="yearly">매년</option>
        </select>
      </div>
      <div class="row">
        <button class="small" id="exportJson">JSON 내보내기</button>
        <button class="small" id="exportCsv">CSV 내보내기</button>
        <button class="small" id="importBtn">불러오기</button>
        <input type="file" id="importFile" accept="application/json" class="hidden">
      </div>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>항목</th><th>분류</th><th>주기</th><th>결제일</th>
        <th class="num">금액</th><th class="num">월 환산</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div id="emptyMsg" class="empty hidden">등록된 고정지출이 없습니다. 위 양식에서 추가해 주세요.</div>
  </section>

  <section id="tab-calendar" class="card hidden">
    <div class="row between" style="margin-bottom:12px">
      <h2 style="margin:0" id="calTitle"></h2>
      <div class="row">
        <button class="small" id="prevYear">◀</button>
        <button class="small" id="thisYear">올해</button>
        <button class="small" id="nextYear">▶</button>
      </div>
    </div>
    <div class="vc-box">
      <h3 id="barTitle"></h3>
      <div class="hint">막대의 색은 항목, 전체 높이는 그달의 합계입니다. 기록이 없는 달은 기본 금액 기준입니다. 막대에 마우스를 올리거나 키보드로 이동하면 항목별 금액이 보입니다.</div>
      <div class="vc-legend" id="barLegend"></div>
      <div id="barChart" role="group" aria-label="월별 지출을 항목별 색으로 나눈 누적 막대 그래프"></div>
      <details class="vc-tbl">
        <summary>표로 보기</summary>
        <div class="scroll"><table id="barTable"></table></div>
      </details>
    </div>
    <div class="grid months" id="months"></div>
  </section>

  <section id="tab-category" class="card hidden">
    <h2 id="catTitle">분류별 연간 지출</h2>
    <div id="catChart"></div>
  </section>
</div>

<script>
(() => {
  'use strict';
  const KEY = 'fixed-expenses.v1';
  const $ = (s, el = document) => el.querySelector(s);
  const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /** @type {{id:string,name:string,category:string,amount:number,cycle:'monthly'|'yearly',month:number,day:number,memo:string,active:boolean,overrides:Object<string,number>}[]}
   *  amount: 기본 금액 / overrides: 'YYYY-MM' → 해당 월의 실제 금액 (없는 달은 기본 금액 적용) */
  let items = load();
  let editingId = null;
  let calYear = new Date().getFullYear();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
    render();
    // 연결이 정상일 때만 기록한다. 읽기 실패·권한 대기 중에는 원본 파일을 덮어쓰지 않고 dirty 표시만 남긴다.
    if (fileHandle) { setDirty(true); if (fileState === 'connected') queueWrite(); }
  }

  // ---- 파일 저장 (File System Access API) ------------------------------------
  // 원본: 사용자가 지정한 JSON 파일 / localStorage: 즉시 표시용 캐시
  const FS_OK = 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
  const DIRTY = 'fixed-expenses.dirty';
  const PICK = { types: [{ description: 'JSON 파일', accept: { 'application/json': ['.json'] } }] };
  let fileHandle = null;
  let fileState = 'none';          // none | connected | needsPermission | error
  let fileMsg = '', lastSaved = null, timer = null, chain = Promise.resolve();

  const setDirty = v => { try { v ? localStorage.setItem(DIRTY, '1') : localStorage.removeItem(DIRTY); } catch {} };
  const isDirty = () => { try { return localStorage.getItem(DIRTY) === '1'; } catch { return false; } };
  const serialize = () => JSON.stringify({ version: 1, items }, null, 2);

  function idb(mode, fn) {
    return new Promise((res, rej) => {
      const r = indexedDB.open('fixed-expenses-meta', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onerror = () => rej(r.error);
      r.onsuccess = () => {
        const tx = r.result.transaction('kv', mode);
        const req = fn(tx.objectStore('kv'));
        tx.oncomplete = () => { r.result.close(); res(req.result); };
        tx.onerror = () => rej(tx.error);
      };
    });
  }
  const saveHandle  = h => idb('readwrite', s => s.put(h, 'handle'));
  const loadHandle  = () => idb('readonly', s => s.get('handle'));
  const clearHandle = () => idb('readwrite', s => s.delete('handle'));

  function cleanOverrides(o) {
    const out = {};
    if (o && typeof o === 'object') {
      for (const [k, v] of Object.entries(o)) {
        if (/^\d{4}-(0[1-9]|1[0-2])$/.test(k) && v !== null && v !== '' && Number.isFinite(Number(v)))
          out[k] = Math.max(0, Number(v));
      }
    }
    return out;
  }

  function normalize(x) {
    return {
      id: typeof x.id === 'string' && x.id ? x.id : uid(),
      name: String(x.name), category: String(x.category || ''),
      amount: Math.max(0, Number(x.amount) || 0),
      cycle: x.cycle === 'yearly' ? 'yearly' : 'monthly',
      month: Math.min(12, Math.max(1, Number(x.month) || 1)),
      day: (x.day === 0 || x.day === '0') ? 0 : Math.min(31, Math.max(1, Number(x.day) || 1)),   // 0 = 상시(날짜 없음)
      memo: String(x.memo || ''), active: x.active !== false,
      overrides: cleanOverrides(x.overrides),
    };
  }

  // 배열 또는 { items: [...] } 형태를 모두 받아 항목 배열로 변환한다. 형식 오류면 예외.
  function parseItems(d) {
    const arr = Array.isArray(d) ? d : d && d.items;
    if (!Array.isArray(arr)) throw new Error('지원하지 않는 파일 형식입니다.');
    return arr.filter(x => x && x.name).map(normalize);
  }

  // 파일 내용을 읽어 항목 배열로 반환. 빈 파일이면 null. 형식 오류면 예외.
  async function readFile(h) {
    const text = (await (await h.getFile()).text()).trim();
    if (!text) return null;
    return parseItems(JSON.parse(text));
  }

  function queueWrite() { clearTimeout(timer); timer = setTimeout(writeFile, 300); }

  function writeFile() {
    chain = chain.then(async () => {
      if (!fileHandle) return;
      try {
        const w = await fileHandle.createWritable();   // 임시 파일에 쓰고 close() 시 교체
        await w.write(serialize());
        await w.close();
        setDirty(false); fileState = 'connected'; fileMsg = ''; lastSaved = new Date();
      } catch (e) {
        fileState = e.name === 'NotAllowedError' ? 'needsPermission' : 'error';
        fileMsg = e.message || String(e);
      }
      renderStorage();
    });
    return chain;
  }

  async function ensurePermission(h) {
    const opt = { mode: 'readwrite' };
    if ((await h.queryPermission(opt)) === 'granted') return true;
    return (await h.requestPermission(opt)) === 'granted';
  }

  // 핸들을 연결한다. 파일이 비어 있으면 현재 목록을 기록하고, 아니면 파일 내용을 불러온다.
  async function attach(h, { askReplace }) {
    let data;
    try { data = await readFile(h); }
    catch (e) { alert('파일을 읽을 수 없습니다: ' + e.message); return false; }
    if (data === null) {
      fileHandle = h; await saveHandle(h); await writeFile();
    } else {
      if (askReplace && items.length && !confirm(`파일의 ${data.length}건으로 현재 목록을 대체할까요?`)) return false;
      fileHandle = h; await saveHandle(h);
      items = data; setDirty(false); fileState = 'connected'; lastSaved = new Date();
      try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
      render();
    }
    renderStorage();
    return true;
  }

  async function reconnect() {                 // 새로고침 후 권한 재승인
    const h = fileHandle;
    if (!(await ensurePermission(h))) return;
    if (isDirty()) {
      const useCurrent = confirm('연결이 끊긴 동안 수정한 내용이 있습니다.\n\n확인: 현재 화면 내용으로 파일을 덮어쓰기\n취소: 파일 내용을 불러오기');
      if (useCurrent) { fileState = 'connected'; await writeFile(); return; }
    }
    try {
      const data = await readFile(h);
      if (data) { items = data; try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} render(); }
      else await writeFile();
      setDirty(false); fileState = 'connected'; lastSaved = new Date();
    } catch (e) { fileState = 'error'; fileMsg = e.message; }
    renderStorage();
  }

  async function initFile() {
    if (!FS_OK) return renderStorage();
    try {
      const h = await loadHandle();
      if (h) {
        fileHandle = h;
        if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await reconnect();
        else fileState = 'needsPermission';
      }
    } catch (e) { fileState = 'error'; fileMsg = e.message; }
    renderStorage();
  }

  function renderStorage() {
    const btn = (a, t, cls = '') => `<button class="small ${cls}" data-fs="${a}">${t}</button>`;
    let dot = '', text = '', note = '', btns = '';
    if (!FS_OK) {
      dot = 'warn'; text = '브라우저에만 저장 중';
      note = '이 브라우저는 파일 직접 저장을 지원하지 않습니다. Chrome·Edge 등 지원 브라우저를 사용하시거나, 아래 [JSON 내보내기]로 주기적으로 백업해 주세요.';
    } else if (!fileHandle) {
      dot = 'warn'; text = '파일 미연결 (브라우저에만 저장 중)';
      note = '저장할 JSON 파일을 지정하면 변경 사항이 그 파일에 자동 기록됩니다. OneDrive·iCloud Drive 등 동기화 폴더에 두면 백업까지 해결됩니다.';
      btns = btn('create', '새 파일 만들기', 'primary') + btn('open', '기존 파일 열기');
    } else if (fileState === 'needsPermission') {
      dot = 'warn'; text = `${esc(fileHandle.name)} · 접근 허용 필요`;
      note = '보안상 브라우저를 다시 열면 파일 접근을 한 번 허용해야 합니다. 허용 전 수정 내용은 브라우저에 임시 보관됩니다.';
      btns = btn('grant', '접근 허용', 'primary') + btn('disconnect', '연결 해제');
    } else if (fileState === 'error') {
      dot = 'err'; text = `${esc(fileHandle.name)} · 저장 실패`;
      note = fileMsg;
      btns = btn('retry', '다시 저장', 'primary') + btn('disconnect', '연결 해제');
    } else {
      dot = 'ok'; text = `${esc(fileHandle.name)} 에 자동 저장 중`;
      note = lastSaved ? `마지막 저장 ${lastSaved.toLocaleTimeString('ko-KR')}` : '';
      btns = btn('disconnect', '연결 해제');
    }
    $('#storageStatus').innerHTML = `<span class="dot ${dot}"></span>${text}`;
    $('#storageNote').textContent = note;
    $('#storageBtns').innerHTML = btns;
  }

  $('#storageBtns').addEventListener('click', async e => {
    const b = e.target.closest('button[data-fs]'); if (!b) return;
    try {
      switch (b.dataset.fs) {
        case 'create': {
          const h = await showSaveFilePicker({ suggestedName: 'fixed-expenses.json', ...PICK });
          if (await ensurePermission(h)) await attach(h, { askReplace: false });
          break;
        }
        case 'open': {
          const [h] = await showOpenFilePicker({ multiple: false, ...PICK });
          if (await ensurePermission(h)) await attach(h, { askReplace: true });
          break;
        }
        case 'grant': await reconnect(); break;
        case 'retry': fileState = 'connected'; await writeFile(); break;
        case 'disconnect':
          if (confirm('파일 연결을 해제할까요? 파일은 삭제되지 않으며, 이후 변경은 브라우저에만 저장됩니다.')) {
            fileHandle = null; fileState = 'none'; setDirty(false); await clearHandle(); renderStorage();
          }
          break;
      }
    } catch (err) {
      if (err.name !== 'AbortError') { fileState = fileHandle ? 'error' : 'none'; fileMsg = err.message; renderStorage(); alert('오류: ' + err.message); }
    }
  });

  // ---- 계산 -------------------------------------------------------------
  const thisYear = () => new Date().getFullYear();
  const ymKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
  const hasVar = it => !!it.overrides && Object.keys(it.overrides).length > 0;
  // y년 m월의 금액: 해당 월 실제 금액이 있으면 그 값, 없으면 기본 금액
  const amountIn = (it, y, m) => {
    const v = it.overrides && it.overrides[ymKey(y, m)];
    return typeof v === 'number' ? v : it.amount;
  };
  // y년 한 해 동안의 지출 합계
  const annualOf = (it, y = thisYear()) => it.cycle === 'monthly'
    ? Array.from({ length: 12 }, (_, k) => amountIn(it, y, k + 1)).reduce((s, v) => s + v, 0)
    : amountIn(it, y, it.month);
  const monthlyEq = (it, y = thisYear()) => annualOf(it, y) / 12;
  const active = () => items.filter(i => i.active);
  const paidIn = (it, m) => it.cycle === 'monthly' || it.month === m;     // m: 1~12
  // 말일 보정: 31일 결제인데 해당 월이 30일까지면 말일로 처리
  // 결제일이 0(상시)이면 0을 돌려준다.
  const dayIn = (it, y, m) => it.day ? Math.min(it.day, new Date(y, m, 0).getDate()) : 0;
  const dayLabel = (it, y, m) => { const d = dayIn(it, y, m); return d ? `${d}일` : '상시'; };

  function nextPayment(it, from) {
    if (!it.day) return null;                 // 날짜가 없는 상시 지출은 '다음 결제'에서 제외
    const y = from.getFullYear();
    for (let k = 0; k < 24; k++) {
      const m0 = from.getMonth() + k;
      const yy = y + Math.floor(m0 / 12), mm = (m0 % 12) + 1;
      if (!paidIn(it, mm)) continue;
      const d = new Date(yy, mm - 1, dayIn(it, yy, mm));
      if (d >= new Date(from.getFullYear(), from.getMonth(), from.getDate())) return d;
    }
    return null;
  }

  // ---- 렌더링 -----------------------------------------------------------
  function render() {
    renderStats(); renderList(); renderCalendar(); renderCategory(); renderCats();
  }

  function renderStats() {
    const a = active();
    const mSum = a.filter(i => i.cycle === 'monthly').reduce((s, i) => s + i.amount, 0);
    const ySum = a.filter(i => i.cycle === 'yearly').reduce((s, i) => s + i.amount, 0);
    const yr = thisYear();
    const annual = a.reduce((s, i) => s + annualOf(i, yr), 0);
    const now = new Date(), thisM = now.getMonth() + 1;
    const thisMonthTotal = a.filter(i => paidIn(i, thisM)).reduce((s, i) => s + amountIn(i, yr, thisM), 0);
    const upcoming = a.map(i => ({ i, d: nextPayment(i, now) })).filter(x => x.d)
      .sort((p, q) => p.d - q.d)[0];
    const cards = [
      ['매월 고정지출', won(mSum), `${a.filter(i => i.cycle === 'monthly').length}건 · 기본 금액 기준`],
      ['연간 고정지출(매년 결제분)', won(ySum), `${a.filter(i => i.cycle === 'yearly').length}건`],
      ['연 환산 총액', won(annual), `${yr}년 기준 · 월 평균 ${won(annual / 12)}`],
      [`${thisM}월 결제 예정`, won(thisMonthTotal), '매월분 + 이번 달 연간분'],
      ['다음 결제', upcoming ? `${upcoming.d.getMonth()+1}/${upcoming.d.getDate()}` : '-',
        upcoming ? `${upcoming.i.name} · ${won(amountIn(upcoming.i, upcoming.d.getFullYear(), upcoming.d.getMonth() + 1))}` : '예정 없음'],
    ];
    $('#stats').innerHTML = cards.map(([l, v, s]) =>
      `<div class="card stat"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="sub">${esc(s)}</div></div>`).join('');
  }

  function renderList() {
    const f = $('#filterCycle').value;
    const rows = items.filter(i => f === 'all' || i.cycle === f)
      .sort((a, b) => (a.cycle === b.cycle ? (a.day || 99) - (b.day || 99) : a.cycle === 'monthly' ? -1 : 1));
    $('#emptyMsg').classList.toggle('hidden', rows.length > 0);
    $('#tbody').innerHTML = rows.map(i => `
      <tr class="${i.active ? '' : 'off'}">
        <td><strong>${esc(i.name)}</strong>${hasVar(i) ? ' <span class="tag">월별 상이</span>' : ''}${i.memo ? `<div style="color:var(--muted);font-size:12px">${esc(i.memo)}</div>` : ''}</td>
        <td>${i.category ? `<span class="tag">${esc(i.category)}</span>` : ''}</td>
        <td><span class="tag ${i.cycle === 'yearly' ? 'y' : ''}">${i.cycle === 'monthly' ? '매월' : '매년'}</span></td>
        <td>${i.cycle === 'yearly' ? i.month + '월 ' : ''}${i.day ? i.day + '일' : '상시'}</td>
        <td class="num">${won(i.amount)}${hasVar(i) ? '<div class="hint">기본</div>' : ''}</td>
        <td class="num">${won(monthlyEq(i, thisYear()))}</td>
        <td class="row" style="justify-content:flex-end;flex-wrap:nowrap">
          <button class="small" data-act="toggle" data-id="${i.id}">${i.active ? '중지' : '재개'}</button>
          <button class="small" data-act="edit" data-id="${i.id}">수정</button>
          <button class="small danger" data-act="del" data-id="${i.id}">삭제</button>
        </td>
      </tr>`).join('');
  }

  function renderCalendar() {
    $('#calTitle').textContent = `${calYear}년 월별 결제 내역`;
    renderBars();
    const now = new Date();
    const totals = Array.from({ length: 12 }, (_, k) =>
      active().filter(i => paidIn(i, k + 1)).reduce((s, i) => s + amountIn(i, calYear, k + 1), 0));
    const max = Math.max(...totals, 1);
    $('#months').innerHTML = totals.map((t, k) => {
      const m = k + 1;
      const list = active().filter(i => paidIn(i, m)).sort((a, b) => (dayIn(a, calYear, m) || 99) - (dayIn(b, calYear, m) || 99));
      const isNow = now.getFullYear() === calYear && now.getMonth() === k;
      return `<div class="month ${isNow ? 'now' : ''}">
        <div class="mh"><span>${m}월</span><span>${won(t)}</span></div>
        <ul>${list.map(i => `<li><span>${dayLabel(i, calYear, m)} ${esc(i.name)}</span><span>${won(amountIn(i, calYear, m))}</span></li>`).join('') || '<li>없음</li>'}</ul>
        <div class="bar" style="width:${(t / max) * 100}%"></div>
      </div>`;
    }).join('');
  }

  // ---- 월별 막대 그래프 ----------------------------------------------------
  // 항목명은 사용자 입력이므로 모두 textContent로만 넣는다.
  const mk = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  // 눈금: 1·2·2.5·5×10^k 중 가장 작은 간격으로 4칸 안팎이 되게 한다.
  function niceScale(max) {
    const raw = max / 4, pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = ([1, 2, 2.5, 5, 10].find(f => f * pow >= raw)) * pow;
    return { step, top: Math.ceil(max / step) * step };
  }
  const tickLabel = n => n === 0 ? '0' : n >= 10000 ? `${+(n / 10000).toFixed(1)}만` : n.toLocaleString('ko-KR');

  // 그래프에 쓸 계열을 정한다. 올해 연간 금액이 큰 항목 6개는 각자 색을 받고, 나머지는 회색 '기타'로 묶는다.
  // 색은 순위가 아니라 항목 목록의 순서로 배정하므로, 연도를 넘겨도 같은 항목은 같은 색을 유지한다.
  const SERIES_MAX = 6;
  function chartSeries() {
    const ranked = active().map(i => ({ i, y: annualOf(i, thisYear()) })).filter(x => x.y > 0).sort((a, b) => b.y - a.y);
    const shown = (ranked.length <= SERIES_MAX ? ranked : ranked.slice(0, SERIES_MAX)).map(x => x.i)
      .sort((a, b) => items.indexOf(a) - items.indexOf(b));
    return { shown, slot: new Map(shown.map((it, k) => [it.id, k])) };
  }

  function renderBars() {
    const root = $('#barChart'), table = $('#barTable'), legend = $('#barLegend');
    root.replaceChildren(); table.replaceChildren(); legend.replaceChildren();

    const { shown, slot } = chartSeries();
    const OTHER = shown.length;                                   // '기타'는 마지막 계열
    const colorOf = s => s === OTHER ? 'var(--vc-other)' : `var(--vc-s${s + 1})`;

    // 월별·계열별 금액 (쌓는 순서 = 계열 번호 순, 맨 위가 '기타')
    const data = Array.from({ length: 12 }, (_, k) => {
      const m = k + 1, by = new Map();
      for (const i of active()) {
        if (!paidIn(i, m)) continue;
        const amt = amountIn(i, calYear, m);
        if (!(amt > 0)) continue;
        const s = slot.has(i.id) ? slot.get(i.id) : OTHER, cur = by.get(s) || { amt: 0, n: 0 };
        cur.amt += amt; cur.n++; by.set(s, cur);
      }
      const segs = [...by].map(([s, v]) => ({ s, amt: v.amt, n: v.n })).sort((a, b) => a.s - b.s);
      return { m, segs, total: segs.reduce((t, x) => t + x.amt, 0) };
    });
    const yearTotal = data.reduce((s, d) => s + d.total, 0);
    $('#barTitle').textContent = `${calYear}년 월별 지출 합계 · 연간 ${won(yearTotal)}`;

    // 이 연도에 실제로 나타나는 계열만 범례·표에 올린다
    const present = [...new Set(data.flatMap(d => d.segs.map(x => x.s)))].sort((a, b) => a - b);
    const otherNames = active().filter(i => !slot.has(i.id) && annualOf(i, calYear) > 0).map(i => i.name);
    const nameOf = s => s === OTHER ? `기타(${otherNames.length}건)` : shown[s].name;
    for (const s of present) {
      const li = mk('span'), sw = mk('i', 'vc-sw'); sw.style.background = colorOf(s);
      li.append(sw, document.createTextNode(nameOf(s)));
      if (s === OTHER) li.title = otherNames.join(', ');
      legend.append(li);
    }

    // 표 보기 (그래프의 모든 값에 접근하는 경로)
    const head = mk('tr');
    head.append(mk('th', '', '월'));
    for (const s of present) head.append(mk('th', 'num', nameOf(s)));
    head.append(mk('th', 'num', '합계'));
    const thead = mk('thead'); thead.append(head); table.append(thead);
    const tb = mk('tbody');
    for (const d of data) {
      const tr = mk('tr'); tr.append(mk('td', '', `${d.m}월`));
      for (const s of present) { const f = d.segs.find(x => x.s === s); tr.append(mk('td', 'num', f ? won(f.amt) : '-')); }
      tr.append(mk('td', 'num', won(d.total))); tb.append(tr);
    }
    table.append(tb);

    const max = Math.max(...data.map(d => d.total));
    if (!(max > 0)) { root.append(mk('div', 'vc-empty', '표시할 지출이 없습니다.')); return; }

    const { step, top } = niceScale(max);
    const plot = mk('div', 'vc-plot'), area = mk('div', 'vc-area'), cols = mk('div', 'vc-cols'), tip = mk('div', 'vc-tip');
    for (let v = step; v <= top + 1e-9; v += step) {           // 0선은 기준선(border)이 대신한다
      const gl = mk('div', 'vc-gl'); gl.style.bottom = `${(v / top) * 100}%`;
      gl.append(mk('span', '', tickLabel(v))); area.append(gl);
    }
    const gl0 = mk('div', 'vc-gl');                              // 0 눈금 라벨 (선은 기준선이 대신함)
    gl0.style.bottom = '0'; gl0.style.borderTop = 'none'; gl0.append(mk('span', '', '0')); area.append(gl0);
    const maxIdx = data.findIndex(d => d.total === max);

    const showTip = (col, d, pct) => {
      tip.replaceChildren(mk('div', 'h', `${calYear}년 ${d.m}월`), mk('div', 'v', won(d.total)));
      for (const x of d.segs.slice().sort((a, b) => b.amt - a.amt)) {
        const row = mk('div', 'r'), key = mk('span', 'k'), line = mk('i');
        line.style.background = colorOf(x.s);
        key.append(line, document.createTextNode(x.s === OTHER ? `기타 ${x.n}건` : shown[x.s].name));
        row.append(key, mk('span', '', won(x.amt))); tip.append(row);
      }
      tip.style.left = '0px'; tip.style.top = '0px'; tip.style.display = 'block';   // 이전 위치가 폭 계산에 영향을 주지 않게 먼저 초기화
      const pr = plot.getBoundingClientRect(), cr = col.getBoundingClientRect();
      const w = tip.offsetWidth, h = tip.offsetHeight;
      const left = Math.max(0, Math.min(cr.left - pr.left + cr.width / 2 - w / 2, pr.width - w));
      const barTop = cr.bottom - pr.top - cr.height * pct / 100;
      tip.style.left = `${left}px`; tip.style.top = `${Math.max(0, barTop - h - 8)}px`;
    };

    data.forEach((d, idx) => {
      const pct = (d.total / top) * 100;
      const col = mk('div', 'vc-col'); col.tabIndex = 0;
      col.setAttribute('aria-label', `${d.m}월 합계 ${won(d.total)}`);
      const bar = mk('div', 'vc-bar'); bar.style.height = `${pct}%`;
      for (const x of d.segs) {                                  // 조각 높이는 그달 합계에서 차지하는 비율
        const seg = mk('div', 'vc-seg');
        seg.style.height = `${(x.amt / d.total) * 100}%`; seg.style.background = colorOf(x.s); bar.append(seg);
      }
      col.append(bar);
      if (idx === maxIdx) {                                     // 값 직접 표시는 합계가 가장 큰 달 한 곳만
        const val = mk('div', 'vc-val', `${+(d.total / 10000).toFixed(1)}만`);
        val.style.bottom = `calc(${pct}% + 4px)`; col.append(val);
      }
      const x = mk('div', 'vc-x', `${d.m}`); x.style.left = '50%'; x.style.transform = 'translateX(-50%)'; col.append(x);
      col.addEventListener('pointerenter', () => showTip(col, d, pct));
      col.addEventListener('focus', () => showTip(col, d, pct));
      col.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
      col.addEventListener('blur', () => { tip.style.display = 'none'; });
      cols.append(col);
    });
    area.append(cols); plot.append(area, tip); root.append(plot);
  }

  function renderCategory() {
    const map = new Map();
    $('#catTitle').textContent = `분류별 연간 지출 (${thisYear()}년)`;
    for (const i of active()) {
      const c = i.category || '미분류';
      map.set(c, (map.get(c) || 0) + annualOf(i, thisYear()));
    }
    const arr = [...map].sort((a, b) => b[1] - a[1]);
    const total = arr.reduce((s, [, v]) => s + v, 0) || 1;
    $('#catChart').innerHTML = arr.length ? arr.map(([c, v]) => `
      <div class="cat-bar"><span class="name">${esc(c)}</span>
        <span class="track"><span class="fill" style="display:block;width:${(v / total) * 100}%"></span></span>
        <span class="amt">${won(v)} (${Math.round((v / total) * 100)}%)</span></div>`).join('')
      : '<div class="empty">데이터가 없습니다.</div>';
  }

  function renderCats() {
    const set = new Set(items.map(i => i.category).filter(Boolean));
    $('#cats').innerHTML = [...set].map(c => `<option value="${esc(c)}">`).join('');
  }

  // ---- 폼 ---------------------------------------------------------------
  const form = $('#form');
  form.month.innerHTML = Array.from({ length: 12 }, (_, k) => `<option value="${k+1}">${k+1}월</option>`).join('');
  form.day.innerHTML = Array.from({ length: 31 }, (_, k) => `<option value="${k+1}">${k+1}일</option>`).join('')
    + '<option value="0">상시 (날짜 없음)</option>';      // 생필품·식료품처럼 특정일에 나가지 않는 지출
  const syncCycle = () => {
    $('#monthField').classList.toggle('hidden', form.cycle.value !== 'yearly');
    $('#varBox').classList.toggle('hidden', form.cycle.value === 'yearly');   // 월별 금액은 매월 항목에만 적용
  };
  form.cycle.addEventListener('change', syncCycle);

  // 월별 금액 입력란: 편집 중인 값은 formOv에 모아 두었다가 저장 시 항목에 반영한다.
  let formOv = {}, varY = thisYear();
  const varYear = $('#varYear'), varInputs = $('#varInputs');

  function renderVar() {
    const ys = new Set([-3, -2, -1, 0, 1].map(d => thisYear() + d).concat(varY));
    for (const k of Object.keys(formOv)) ys.add(Number(k.slice(0, 4)));
    varYear.innerHTML = [...ys].sort().map(y => `<option value="${y}">${y}년</option>`).join('');
    varYear.value = String(varY);
    varInputs.innerHTML = Array.from({ length: 12 }, (_, k) => {
      const v = formOv[ymKey(varY, k + 1)];
      return `<label>${k + 1}월<input type="number" min="0" step="1" inputmode="numeric" data-m="${k + 1}"
        value="${v ?? ''}" placeholder="${esc(form.amount.value || '기본')}"></label>`;
    }).join('');
  }
  function flushVar() {                       // 화면의 입력값을 formOv로 옮긴다 (빈 칸 = 기본 금액)
    varInputs.querySelectorAll('input').forEach(inp => {
      const key = ymKey(varY, inp.dataset.m);
      if (inp.value === '') delete formOv[key]; else formOv[key] = Math.max(0, Number(inp.value) || 0);
    });
  }
  varYear.addEventListener('change', () => { flushVar(); varY = Number(varYear.value); renderVar(); });
  form.amount.addEventListener('input', () =>
    varInputs.querySelectorAll('input').forEach(inp => inp.placeholder = form.amount.value || '기본'));

  function resetForm() {
    editingId = null; form.reset(); syncCycle();
    formOv = {}; varY = thisYear(); $('#varBox').open = false; renderVar();
    $('#formTitle').textContent = '고정지출 추가';
    $('#submitBtn').textContent = '추가';
    $('#cancelBtn').classList.add('hidden');
  }
  $('#cancelBtn').addEventListener('click', resetForm);

  form.addEventListener('submit', e => {
    e.preventDefault();
    flushVar();
    const d = new FormData(form);
    const rec = {
      name: d.get('name').trim(),
      category: d.get('category').trim(),
      amount: Math.max(0, Number(d.get('amount')) || 0),
      cycle: d.get('cycle'),
      month: Number(d.get('month')) || 1,
      day: d.get('day') === '0' ? 0 : (Number(d.get('day')) || 1),
      memo: d.get('memo').trim(),
    };
    rec.overrides = rec.cycle === 'monthly' ? cleanOverrides(formOv) : {};
    if (!rec.name) return;
    if (editingId) {
      items = items.map(i => i.id === editingId ? { ...i, ...rec } : i);
    } else {
      items.push({ id: uid(), active: true, ...rec });
    }
    resetForm(); save();
  });

  $('#tbody').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const it = items.find(i => i.id === b.dataset.id); if (!it) return;
    if (b.dataset.act === 'toggle') { it.active = !it.active; save(); }
    else if (b.dataset.act === 'del') {
      if (confirm(`'${it.name}' 항목을 삭제할까요?`)) { items = items.filter(i => i !== it); save(); }
    } else {
      editingId = it.id;
      for (const k of ['name','category','amount','cycle','month','day','memo']) form[k].value = it[k];
      syncCycle();
      formOv = { ...(it.overrides || {}) };
      const yrs = Object.keys(formOv).map(k => Number(k.slice(0, 4)));
      varY = yrs.length ? Math.max(...yrs) : thisYear();
      $('#varBox').open = yrs.length > 0; renderVar();
      $('#formTitle').textContent = '고정지출 수정';
      $('#submitBtn').textContent = '저장';
      $('#cancelBtn').classList.remove('hidden');
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });

  // ---- 탭 / 필터 / 연도 ---------------------------------------------------
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
    for (const t of ['list', 'calendar', 'category'])
      $('#tab-' + t).classList.toggle('hidden', t !== b.dataset.tab);
  }));
  $('#filterCycle').addEventListener('change', renderList);
  $('#prevYear').onclick = () => { calYear--; renderCalendar(); };
  $('#nextYear').onclick = () => { calYear++; renderCalendar(); };
  $('#thisYear').onclick = () => { calYear = new Date().getFullYear(); renderCalendar(); };

  // ---- 내보내기 / 불러오기 -------------------------------------------------
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
  }
  $('#exportJson').onclick = () =>
    download('fixed-expenses.json', JSON.stringify(items, null, 2), 'application/json');
  $('#exportCsv').onclick = () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const head = ['항목','분류','주기','결제월','결제일','기본금액',`${thisYear()}년 월환산`,'상태','메모'];
    const rows = items.map(i => [i.name, i.category, i.cycle === 'monthly' ? '매월' : '매년',
      i.cycle === 'yearly' ? i.month : '', i.day || '상시', i.amount, Math.round(monthlyEq(i, thisYear())),
      i.active ? '진행' : '중지', i.memo].map(q).join(','));
    download('fixed-expenses.csv', '﻿' + [head.map(q).join(','), ...rows].join('\n'), 'text/csv');
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      // 배열 또는 { version, items } 형식을 모두 받는다. 불러온 항목은 새 id를 부여해 기존 항목과 겹치지 않게 한다.
      const clean = parseItems(JSON.parse(await file.text())).map(x => ({ ...x, id: uid() }));
      if (confirm(`${clean.length}건을 불러옵니다. 기존 데이터를 대체할까요?\n(취소: 기존 데이터에 추가)`))
        items = clean; else items = items.concat(clean);
      save();
    } catch { alert('올바른 JSON 파일이 아닙니다.'); }
    e.target.value = '';
  });

  syncCycle(); renderVar(); render(); renderStorage(); initFile();
})();
</script>
</body>
</html>
